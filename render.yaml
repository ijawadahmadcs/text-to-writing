services:
  - type: web
    name: text-to-writing-backend
    runtime: python
    buildCommand: pip install -r python/requirements.txt
    startCommand: cd python && gunicorn dev_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.0
